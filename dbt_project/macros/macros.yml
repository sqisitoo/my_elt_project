version: 2

macros:
  - name: round_coordinate
    description: >
      Rounds a latitude or longitude expression to 4 decimal places.
      This is a warehouse contract, not a presentation choice: dbt models use
      the rounded value when generating surrogate keys and when joining
      OpenWeather observations to configured locations.
      The shared doc blocks round_coordinate_contract__latitude and
      round_coordinate_contract__longitude are the column-documentation surface
      of this same contract and must stay in sync with it.
      TRAP: if one model drifts away from this shared precision, dbt will
      usually still build successfully. The failure mode is semantic: joins to
      dim_location can start returning NULL location_id, and downstream fact
      tests catch it only after the contract has already been broken. If the
      precision ever changes, update this macro and the shared doc blocks
      together and roll the change out as a coordinated contract migration.
    arguments:
      - name: column_name
        type: string
        description: >
          SQL expression for the latitude or longitude value that must be
          normalized to the shared warehouse precision.
  - name: generate_schema_name
    description: >
      Overrides dbt's built-in schema naming to implement the warehouse layout
      from ADR-0005. In the prod target, a node's configured schema (+schema) is
      used verbatim, so staging models and seeds land in STAGING and marts in
      MARTS. In any other target, every node goes to the target schema (DEV_VLAD
      for local development) and +schema is ignored. The logic matches dbt's
      built-in generate_schema_name_for_env, but is written out in the project
      so that a dbt upgrade cannot change where relations are built.
      TRAP: the switch is on the target name, not on its settings. A production
      run under any target other than 'prod' builds every node into the target
      schema. And because dev ignores +schema, a typo in a schema name is
      invisible locally and fails only the prod build, since dbt cannot create
      schemas (ADR-0006).
    arguments:
      - name: custom_schema_name
        type: string
        description: >
          The node's configured +schema, or none when the node has no custom
          schema. Used only in the prod target, after trimming whitespace.
      - name: node
        type: object
        description: >
          The node being built. Required by dbt's macro signature; unused here.
