version: 2

sources:
  - name: openweather_air_pollution
    database: RAW
    schema: AIR_POLLUTION
    tables:
      - name: raw_air_pollution
        identifier: RAW_AIR_POLLUTION
        description: "Raw JSON payloads from OpenWeatherMap Air Pollution API"
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 3, period: hour}
          loaded_at_field: _RAW_LOADED_AT

  - name: openweather_weather
    database: RAW
    schema: WEATHER
    tables:
      - name: raw_weather
        identifier: RAW_WEATHER
        description: "Raw JSON payload from OpenWeatherMap One Call 4.0 API"
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 3, period: hour}
          loaded_at_field: _RAW_LOADED_AT