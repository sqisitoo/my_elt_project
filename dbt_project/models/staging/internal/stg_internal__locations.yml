version: 2

models:
  - name: stg_internal__locations
    description: >
      Staged configured locations from the cities_config seed.
      Grain: one row per configured city and its coordinate pair at the shared
      coordinate precision (city_name + latitude + longitude). Coordinates are
      normalized via the round_coordinate contract so they match the join keys
      used by OpenWeather staging models.

    columns:
      - name: location_id
        description: >
          Surrogate key over city_name + latitude + longitude (after rounding
          to 4 dp). TRAP: the key is derived, not assigned — editing a city
          label or nudging a coordinate in the cities_config seed produces a
          different location_id for what a human calls the same place, and
          nothing in the data links the old key to the new one.
        data_tests:
          - unique
          - not_null

      - name: city_name
        description: >
          Configured city label from the cities_config seed. It contributes to
          location_id, so changing it creates a new logical location even when
          the coordinates are unchanged.
        data_tests:
          - not_null

      - name: latitude
        description: "{{ doc('round_coordinate_contract__latitude') }}"
        data_tests:
          - not_null

      - name: longitude
        description: "{{ doc('round_coordinate_contract__longitude') }}"
        data_tests:
          - not_null